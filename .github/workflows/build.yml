name: Build Farm World

on:
  push:
    branches: [main, unity]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [Android, WebGL]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Android SDK + IL2CPP need room)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android/sdk/ndk || true
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Build with Unity 6
        id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.85f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: FarmWorld.EditorTools.BuildScript.BuildFromCommandLine
          buildName: FarmWorld
          versioning: None

      - name: Publish build to the builds branch
        if: success()
        run: |
          set -e
          sudo chown -R "$(id -u)":"$(id -g)" build || true
          git config user.name "farm-world-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin builds:builds || true
          rm -rf /tmp/out && mkdir -p /tmp/out
          if [ "${{ matrix.targetPlatform }}" = "Android" ]; then
            find build/Android -name "*.apk" -exec cp {} /tmp/out/FarmWorld-Unity.apk \;
          else
            cp -r build/WebGL/FarmWorld /tmp/out/web 2>/dev/null || cp -r build/WebGL/* /tmp/out/web
          fi
          ls -la /tmp/out
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/wt && git worktree prune
            git worktree add /tmp/wt builds
            cd /tmp/wt
            git pull --rebase origin builds || true
            if [ "${{ matrix.targetPlatform }}" = "Android" ]; then
              cp /tmp/out/FarmWorld-Unity.apk .
            else
              rm -rf web && cp -r /tmp/out/web web
            fi
            echo "${{ matrix.targetPlatform }}: ${GITHUB_SHA} $(date -u +%FT%TZ)" >> BUILDS.log
            git add -A
            git commit -m "CI: ${{ matrix.targetPlatform }} build of ${GITHUB_SHA::7}" || true
            if git push origin builds; then break; fi
            cd - && sleep $((attempt * 5))
          done

  report:
    name: Failure report
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect logs of failed jobs into the ci-logs branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p /tmp/log
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" > /tmp/log/jobs.json || true
          for id in $(jq -r '.jobs[] | select(.conclusion=="failure") | .id' /tmp/log/jobs.json); do
            name=$(jq -r ".jobs[] | select(.id==$id) | .name" /tmp/log/jobs.json)
            for t in 1 2 3 4 5 6; do
              curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/$id/logs" -o "/tmp/log/full-$name.log" || true
              [ -s "/tmp/log/full-$name.log" ] && break
              sleep 20
            done
            ls -la /tmp/log
            grep -nE "error|Error|ERROR|exception|Exception|failed|Failed" "/tmp/log/full-$name.log" | head -400 > "/tmp/log/errors-$name.log" || true
            tail -n 2500 "/tmp/log/full-$name.log" > "/tmp/log/tail-$name.log"
            rm -f "/tmp/log/full-$name.log"
          done
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > /tmp/log/RUN.txt
          git config user.name "farm-world-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf . -q || true
          cp /tmp/log/* .
          git add -A && git commit -qm "CI failure report ${GITHUB_SHA::7}"
          git push -f origin HEAD:ci-logs
