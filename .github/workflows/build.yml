name: Build Farm World
# Personal licence: activated per run with the Unity Licensing Client (UNITY_EMAIL/UNITY_PASSWORD) and returned afterwards.

on:
  push:
    branches: [main, unity]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            image: unityci/editor:ubuntu-6000.0.85f1-android-3
          - target: WebGL
            image: unityci/editor:ubuntu-6000.0.85f1-webgl-3
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library2-${{ matrix.target }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library2-${{ matrix.target }}-

      - name: Build with Unity 6 (full log kept)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p build lic
          printf '%s' "$UNITY_LICENSE" > lic/Unity_lic.ulf
          echo "licence bytes: $(wc -c < lic/Unity_lic.ulf)"
          if [ "${{ matrix.target }}" = "Android" ]; then OUT=build/Android/FarmWorld.apk; else OUT=build/WebGL/FarmWorld; fi
          { echo "credentials present: email=$([ -n "$UNITY_EMAIL" ] && echo yes || echo no) password=$([ -n "$UNITY_PASSWORD" ] && echo yes || echo no)"; echo "licence bytes: $(wc -c < lic/Unity_lic.ulf)"; head -c 60 lic/Unity_lic.ulf | tr -d '\r'; echo; grep -o '<License id="[^"]*"' lic/Unity_lic.ulf | head -1; } > build-${{ matrix.target }}.log
          docker run --rm \
            -v "$PWD":/project -w /project \
            -v "$PWD/lic":/lic:ro \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            ${{ matrix.image }} \
            bash -c "mkdir -p /root/.local/share/unity3d/Unity /root/.cache/unity3d && \
              LC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client && \
              echo '--- activating personal licence on this machine' && \
              date -u; (timeout -k 10 240 \$LC --activate-all --include-personal --username \"\$UNITY_EMAIL\" --password \"\$UNITY_PASSWORD\" || true) && \
              date -u; (timeout -k 10 120 \$LC --showEntitlements | grep -iE 'id|personal|headless' | head -20 || true) && \
              echo '--- building' && \
              date -u; timeout -k 30 50m unity-editor -nographics -logFile - -username \"\$UNITY_EMAIL\" -password \"\$UNITY_PASSWORD\" -projectPath /project -buildTarget ${{ matrix.target }} \
              -executeMethod FarmWorld.EditorTools.BuildScript.BuildFromCommandLine -customBuildPath /project/$OUT; \
              rc=\$?; date -u; echo \"--- unity exit code \$rc (124 = stopped after 50 min)\"; echo '--- returning licence'; timeout -k 10 120 \$LC --deactivate-all --username \"\$UNITY_EMAIL\" --password \"\$UNITY_PASSWORD\" >/dev/null 2>&1 || true; exit \$rc" \
            2>&1 | python3 .github/scripts/redact.py | tee -a build-${{ matrix.target }}.log
          rm -rf lic
          sudo chown -R "$(id -u)":"$(id -g)" build Library || true
          ls -laR build | head -40

      - name: Publish build to the builds branch
        if: success()
        run: |
          set -e
          git config user.name "farm-world-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin builds:builds
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/wt; git worktree prune
            git worktree add /tmp/wt builds
            if [ "${{ matrix.target }}" = "Android" ]; then
              cp build/Android/FarmWorld.apk /tmp/wt/FarmWorld-Unity.apk
            else
              rm -rf /tmp/wt/web && cp -r build/WebGL/FarmWorld /tmp/wt/web
            fi
            cd /tmp/wt
            echo "${{ matrix.target }} ${GITHUB_SHA::7} $(date -u +%FT%TZ)" >> BUILDS.log
            git add -A && git commit -qm "CI: ${{ matrix.target }} build of ${GITHUB_SHA::7}"
            if git push origin HEAD:builds; then break; fi
            cd "$GITHUB_WORKSPACE"; git fetch origin builds:builds --force; sleep $((attempt * 7))
          done

      - name: Save log to ci-logs branch
        if: always()
        run: |
          rm -rf lic
          mkdir -p /tmp/log
          LOG=$GITHUB_WORKSPACE/build-${{ matrix.target }}.log
          sudo chown "$(id -u)" "$LOG" 2>/dev/null || true
          [ -f "$LOG" ] || echo "no log" > "$LOG"
          grep -nE "error|Error|ERROR|Exception|Failed|failed|\[Build\]|licence bytes|License id|^---|xml|activat|Activat" "$LOG" | grep -v "^.*warning" | head -500 > /tmp/log/errors-${{ matrix.target }}.log || true
          tail -n 3000 "$LOG" > /tmp/log/tail-${{ matrix.target }}.log
          echo "${{ job.status }} run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > /tmp/log/status-${{ matrix.target }}.txt
          sudo chown -R "$(id -u)":"$(id -g)" . || true
          BR=ci-logs-${{ matrix.target }}
          cd /tmp/log
          git init -q && git checkout -q -b logtmp
          git config user.name "farm-world-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "log ${{ matrix.target }} ${GITHUB_SHA::7} ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:$BR
